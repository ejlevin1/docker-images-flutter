name: "Build and Publish Flutter Docker Images"

on:
  push:
    branches: [master]
    paths:
      - sdk/**
      - flutter-versions.yml
      - .github/workflows/build.yml
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: flutter:latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Read Flutter version
        id: version
        run: |
          version=$(yq '.latest' flutter-versions.yml)
          echo "flutter_version=$version" >> "$GITHUB_OUTPUT"
          echo "safe_version=${version//+/-}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sdk
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            flutter_version=${{ steps.version.outputs.flutter_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/flutter:latest
            ghcr.io/${{ github.repository_owner }}/flutter:${{ steps.version.outputs.safe_version }}
